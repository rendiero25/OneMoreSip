<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a drink sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Arabic:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums">

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<dc-import name="Home" state="base" theme="{{theme}}" added="{{addedMl}}" snack="{{addedMl}}" hint-size="390px,844px"></dc-import>
</sc-if>

<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="position: absolute; inset: 0">
<dc-import name="Home" state="base" theme="{{theme}}" hint-size="390px,844px"></dc-import>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: {{t.scrim}}"></div>

<div role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 800px; overflow: hidden; background: {{t.surface}}; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 32px rgba(17,19,18,0.20); padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div style="width: 40px; height: 5px; border-radius: 999px; background: {{t.handle}}; align-self: center"></div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 id="sheet-title" style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800">Add a drink</h2>
<button type="button" aria-label="Close" style="width: 48px; height: 48px; border: none; border-radius: 999px; background: {{t.surfaceAlt}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; line-height: 20px; font-weight: 700; color: {{t.muted}}">Recent &amp; favorites</div>
<div role="radiogroup" aria-label="Drink" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{drinks}}" as="d" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{d.sel}}" onClick="{{d.pick}}" style="min-height: 104px; padding: 10px 4px; border-radius: 20px; border: 2px solid {{d.border}}; background: {{d.bg}}; color: {{t.ink}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; cursor: pointer">
<span style="width: 48px; height: 48px; border-radius: 16px; background: {{d.well}}; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg></span>
<span style="font-size: 14px; line-height: 17px; font-weight: 700; text-align: center">{{d.name}}</span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; line-height: 20px; font-weight: 700; color: {{t.muted}}">Amount</div>
<div role="radiogroup" aria-label="Amount" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{vols}}" as="v" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{v.sel}}" onClick="{{v.pick}}" style="min-height: 64px; border: none; border-radius: 12px; background: {{v.bg}}; color: {{v.fg}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer"><span style="font-size: 18px; line-height: 22px; font-weight: 800">{{v.n}}</span><span style="font-size: 14px; line-height: 18px; font-weight: 600">ml</span></button>
</sc-for>
<button type="button" role="radio" aria-checked="{{customOn}}" onClick="{{openCustom}}" style="min-height: 64px; border: none; border-radius: 12px; background: {{customBg}}; color: {{customFg}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h2"></path><path d="M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg><span style="font-size: 14px; line-height: 18px; font-weight: 700">Custom</span></button>
</div>
</div>

<sc-if value="{{customOn}}" hint-placeholder-val="{{ false }}">
<div style="border-radius: 20px; background: {{t.accentTint}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" aria-label="Less" onClick="{{minus}}" style="width: 48px; height: 48px; border: none; border-radius: 999px; background: {{t.surface}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<div aria-live="polite" style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 40px; line-height: 44px; font-weight: 800; letter-spacing: -0.02em">{{custom}}</span><span style="font-size: 20px; font-weight: 700; color: {{t.muted}}">ml</span></div>
<button type="button" aria-label="More" onClick="{{plus}}" style="width: 48px; height: 48px; border: none; border-radius: 999px; background: {{t.surface}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
</div>
<label for="{{sliderId}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Custom amount in ml</label>
<input id="{{sliderId}}" type="range" min="50" max="1000" step="10" value="{{custom}}" onChange="{{slide}}" style="width: 100%; height: 32px; accent-color: {{t.accent}}; margin: 0">
<div style="display: flex; justify-content: space-between; font-size: 14px; color: {{t.muted}}; font-weight: 600"><span>50 ml</span><span>1,000 ml</span></div>
</div>
</sc-if>

<sc-if value="{{showNote}}" hint-placeholder-val="{{ false }}">
<div style="border-radius: 16px; background: {{t.sunTint}}; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-size: 15px; line-height: 20px; font-weight: 700">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>
<span>{{note}}</span>
</div>
</sc-if>

<sc-if value="{{warn}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="border-radius: 20px; background: {{t.warnBg}}; color: {{t.warnFg}}; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
<div style="flex-shrink: 0"><dc-import name="Sippy" state="tired" size="48" hint-size="48px,48px"></dc-import></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; line-height: 20px; font-weight: 800">That's a lot in one hour.</span><span style="font-size: 15px; line-height: 20px; font-weight: 600">Take it easy — sip slowly.</span></div>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 10px">
<button type="button" style="min-height: 56px; border: 2px solid {{t.ink}}; border-radius: 999px; background: transparent; color: {{t.ink}}; font-family: inherit; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
Snap your drink
<span style="padding: 2px 8px; border-radius: 999px; background: #FFD27A; color: #3A2600; font-size: 14px; font-weight: 800">Premium</span>
</button>
<button type="button" onClick="{{addDrink}}" style="min-height: 56px; border: none; border-radius: 999px; background: {{t.ink}}; color: {{t.onInk}}; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Add drink</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"variant":{"editor":"enum","options":["water","tea","warning","added"],"default":"water"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const dark = theme === 'dark';
    const variant = this.props.variant ?? 'water';
    const t = dark
      ? { bg: '#121413', surface: '#1C1F1E', surfaceAlt: '#262A29', ink: '#ECEEEC', muted: '#9BA3A1', onInk: '#121413', accent: '#4FD1C1', accentTint: '#163330', mint: '#1F4A45', sunTint: '#3A3019', coralTint: '#3D251F', warnBg: 'rgba(242,184,92,0.18)', warnFg: '#F2B85C', scrim: 'rgba(0,0,0,0.6)', handle: '#3A3F3D' }
      : { bg: '#F7F4EE', surface: '#FFFFFF', surfaceAlt: '#EFEBE3', ink: '#111312', muted: '#5B6160', onInk: '#FFFFFF', accent: '#0B7F75', accentTint: '#E3F5F1', mint: '#BFEAE3', sunTint: '#FFEFC7', coralTint: '#FFE1D8', warnBg: '#FFE9C2', warnFg: '#8A4F00', scrim: 'rgba(17,19,18,0.45)', handle: '#D6D1C7' };

    const presets = {
      water: { drink: 'water', vol: 250, custom: false, hour: 0 },
      tea: { drink: 'tea', vol: 330, custom: true, hour: 0 },
      warning: { drink: 'water', vol: 500, custom: false, hour: 900 },
      added: { drink: 'water', vol: 250, custom: false, hour: 0, done: true }
    };
    const p = presets[variant] || presets.water;
    const drinkId = st.drink ?? p.drink;
    const customOn = st.customOn ?? p.custom;
    const vol = st.vol ?? p.vol;
    const done = st.done ?? !!p.done;

    const D = {
      water: { name: 'Water', factor: 1, sugar: 0, well: t.accentTint, icon: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z' },
      tea: { name: 'Iced sweet tea', factor: 0.9, sugar: 7.6, well: t.sunTint, icon: 'M6 3h12l-1.5 17a1.5 1.5 0 0 1-1.5 1.4H9a1.5 1.5 0 0 1-1.5-1.4zM6.5 8h11M9.5 11h2.5v2.5H9.5zM13 14h2.5v2.5H13zM15 3l2-2' },
      coffee: { name: 'Coffee with milk', factor: 0.9, sugar: 2, well: t.coralTint, icon: 'M4 8h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 10h2a2.5 2.5 0 0 1 0 5h-2M8 2v3M12 2v3' },
      coconut: { name: 'Coconut water', factor: 0.95, sugar: 6, well: t.mint, icon: 'M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM15 9l4-7M9 13a3 3 0 0 0 3 3' }
    };
    const drinks = ['water', 'tea', 'coffee', 'coconut'].map((id) => {
      const on = drinkId === id;
      return { id, name: D[id].name, icon: D[id].icon, well: on ? t.surface : D[id].well, sel: on, border: on ? t.accent : 'transparent', bg: on ? t.accentTint : t.surfaceAlt, pick: () => this.setState({ drink: id }) };
    });
    const vols = [150, 250, 350, 500].map((n) => {
      const on = !customOn && vol === n;
      return { n, sel: on, bg: on ? t.ink : t.surfaceAlt, fg: on ? t.onInk : t.ink, pick: () => this.setState({ vol: n, customOn: false }) };
    });
    const clamp = (n) => Math.max(50, Math.min(1000, Math.round(n / 10) * 10));
    const d = D[drinkId];
    const counted = Math.round(vol * d.factor);
    const sugar = Math.round(vol * d.sugar / 100);
    const note = 'Counts as ' + counted + ' ml' + (sugar > 0 ? ' · ' + sugar + ' g sugar' : '');
    if (!this._sid) this._sid = 'vol-' + Math.random().toString(36).slice(2, 8);

    return {
      t, theme, done, open: !done, drinks, vols, customOn,
      customBg: customOn ? t.ink : t.surfaceAlt, customFg: customOn ? t.onInk : t.ink,
      custom: vol, sliderId: this._sid,
      openCustom: () => this.setState({ customOn: true }),
      slide: (e) => this.setState({ vol: clamp(Number(e.target.value)) }),
      minus: () => this.setState({ vol: clamp(vol - 10) }),
      plus: () => this.setState({ vol: clamp(vol + 10) }),
      showNote: drinkId !== 'water',
      note,
      warn: p.hour + vol > 1000,
      addedMl: counted,
      addDrink: () => this.setState({ done: true })
    };
  }
}
</script>
</body>
</html>
