<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sippy — seven states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 1000px; box-sizing: border-box; padding: 64px; background: #F7F4EE; color: #111312; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 32px">
<header style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5B6160">UI-00 · Mascot</div>
<h1 style="margin: 0; font-size: 40px; line-height: 46px; font-weight: 700">Sippy — seven states</h1>
</div>
<div style="font-size: 15px; line-height: 22px; color: #5B6160; max-width: 560px; text-align: right">Geometric drop, teal gradient #0B7F75 → #4FD1C1, white highlight, dot eyes, small mouth. Gender-neutral, not babyish. Only the face and one small prop change.</div>
</header>

<section style="background: #FFFFFF; border-radius: 28px; padding: 32px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{states}}" as="s" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<div style="width: 100%; height: 170px; border-radius: 20px; background: #F7F4EE; display: flex; align-items: center; justify-content: center">
<dc-import name="Sippy" state="{{s.id}}" size="140" hint-size="140px,140px"></dc-import>
</div>
<div style="font-size: 17px; font-weight: 700">{{s.name}}</div>
<div style="font-size: 14px; line-height: 20px; color: #5B6160">{{s.when}}</div>
</div>
</sc-for>
</section>

<section style="background: #121413; color: #ECEEEC; border-radius: 28px; padding: 32px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{states}}" as="s" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<div style="width: 100%; height: 170px; border-radius: 20px; background: #1C1F1E; display: flex; align-items: center; justify-content: center">
<dc-import name="Sippy" state="{{s.id}}" size="140" hint-size="140px,140px"></dc-import>
</div>
<div style="font-size: 17px; font-weight: 700">{{s.name}}</div>
<div style="font-size: 14px; line-height: 20px; color: #9BA3A1">{{s.when}}</div>
</div>
</sc-for>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      states: [
        { id: 'fresh', name: 'Fresh', when: 'Morning, just started. Sparkle prop.' },
        { id: 'happy', name: 'Happy', when: 'On pace or just logged. Rosy cheeks.' },
        { id: 'thirsty', name: 'Thirsty', when: 'Behind pace. Worried brows, empty drop.' },
        { id: 'tired', name: 'Tired', when: 'Long gap, late afternoon. Heavy lids.' },
        { id: 'sleeping', name: 'Sleeping', when: 'Bedtime and quiet hours. Zz.' },
        { id: 'celebrating', name: 'Celebrating', when: 'Goal reached, streaks, badges. Confetti.' },
        { id: 'waiting', name: 'Waiting', when: 'Fasting hours — patient, no nagging. Crescent.' }
      ]
    };
  }
}
</script>
</body>
</html>
