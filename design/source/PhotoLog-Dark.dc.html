<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI photo flow — dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 2970px; height: 900px; display: flex; gap: 40px; background: #0B0D0C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #ECEEEC">
<sc-for list="{{frames}}" as="f" hint-placeholder-count="7">
<div style="width: 390px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px">
<div style="height: 40px; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700"><span style="min-width: 32px; height: 32px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #ECEEEC; color: #121413; display: flex; align-items: center; justify-content: center; font-size: 15px">{{f.n}}</span>{{f.name}}</div>
<div style="width: 390px; height: 844px; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 1px rgba(236,238,236,0.12)">
<dc-import name="PhotoLog" theme="dark" screen="{{f.screen}}" hint-size="390px,844px"></dc-import>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2970,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { frames: [
      { n: 1, name: 'Consent (one-time)', screen: 'consent' },
      { n: 2, name: 'Camera · 128 / 150', screen: 'camera' },
      { n: 3, name: 'Analyzing', screen: 'analyzing' },
      { n: 4, name: 'Result', screen: 'result' },
      { n: 5, name: 'Free user · demo + teaser', screen: 'demo' },
      { n: 6, name: 'Quota low', screen: 'low' },
      { n: 7, name: 'Quota empty', screen: 'empty' }
    ] };
  }
}
</script>
</body>
</html>
