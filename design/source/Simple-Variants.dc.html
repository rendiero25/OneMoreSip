<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simple Mode variants</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 2540px; height: 900px; display: flex; gap: 40px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111312">
<sc-for list="{{frames}}" as="f" hint-placeholder-count="6">
<div style="width: 390px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px">
<div style="height: 40px; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700"><span style="min-width: 32px; height: 32px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #111312; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px">{{f.n}}</span>{{f.name}}</div>
<div style="width: 390px; height: 844px; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 1px rgba(17,19,18,0.10)">
<dc-import name="SimpleHome" theme="{{f.theme}}" contrast="{{f.contrast}}" count="{{f.count}}" saved="{{f.saved}}" hint-size="390px,844px"></dc-import>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2540,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { frames: [
      { n: 1, name: 'Light · before tap', theme: 'light', contrast: 'normal', count: 3, saved: false },
      { n: 2, name: 'Light · just saved', theme: 'light', contrast: 'normal', count: 4, saved: true },
      { n: 3, name: 'Dark · before tap', theme: 'dark', contrast: 'normal', count: 3, saved: false },
      { n: 4, name: 'Dark · just saved', theme: 'dark', contrast: 'normal', count: 4, saved: true },
      { n: 5, name: 'High contrast · before', theme: 'light', contrast: 'high', count: 3, saved: false },
      { n: 6, name: 'High contrast · saved', theme: 'light', contrast: 'high', count: 4, saved: true }
    ] };
  }
}
</script>
</body>
</html>
