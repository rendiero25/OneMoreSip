<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding steps — light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Arabic:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 4690px; height: 900px; display: flex; gap: 40px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111312">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="11">
<div style="width: 390px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px">
<div style="height: 40px; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700"><span style="min-width: 32px; height: 32px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #111312; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px">{{s.n}}</span>{{s.name}}</div>
<div style="width: 390px; height: 844px; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 1px rgba(17,19,18,0.10)">
<dc-import name="Onboarding" step="{{s.n}}" theme="light" hint-size="390px,844px"></dc-import>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":4690,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Language', 'Name', 'Units', 'Weight', 'Activity', 'Wake & bedtime', 'Medical safety', 'Experience', 'Your goal', 'Notifications', 'Keep reminders working (Android)'];
    return { steps: names.map((name, i) => ({ n: i + 1, name })) };
  }
}
</script>
</body>
</html>
