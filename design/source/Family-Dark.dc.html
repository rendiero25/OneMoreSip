<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family — dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 2110px; height: 900px; display: flex; gap: 40px; background: #0B0D0C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #ECEEEC">
<sc-for list="{{frames}}" as="f" hint-placeholder-count="5">
<div style="width: 390px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px">
<div style="height: 40px; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700"><span style="min-width: 32px; height: 32px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #ECEEEC; color: #121413; display: flex; align-items: center; justify-content: center; font-size: 15px">{{f.n}}</span>{{f.name}}</div>
<div style="width: 390px; height: 844px; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 1px rgba(236,238,236,0.12)">
<dc-import name="Family" theme="dark" screen="{{f.screen}}" hint-size="390px,844px"></dc-import>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2110,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { frames: [
      { n: 1, name: 'Family · Mom alert', screen: 'overview' },
      { n: 2, name: 'Invite family', screen: 'invite' },
      { n: 3, name: 'Accept & consent (their phone)', screen: 'consent' },
      { n: 4, name: 'Member · caregiver settings', screen: 'member' },
      { n: 5, name: 'Kid profile', screen: 'kid' }
    ] };
  }
}
</script>
</body>
</html>
