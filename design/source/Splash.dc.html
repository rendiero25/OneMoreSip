<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Splash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 0 20px 56px; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
<div style="position: relative; width: 300px; height: 300px; border-radius: 999px; background: {{t.ring}}; display: flex; align-items: center; justify-content: center">
<span aria-hidden="true" style="position: absolute; top: 18px; right: 30px; width: 34px; height: 34px; border-radius: 999px; background: {{t.sun}}; display: block"></span>
<span aria-hidden="true" style="position: absolute; bottom: 34px; left: 22px; width: 20px; height: 20px; border-radius: 999px; background: {{t.coral}}; display: block"></span>
<span aria-hidden="true" style="position: absolute; top: 64px; left: 14px; width: 12px; height: 12px; border-radius: 999px; background: {{t.accent}}; display: block"></span>
<div style="width: 220px; height: 220px; border-radius: 999px; background: {{t.halo}}; display: flex; align-items: center; justify-content: center">
<dc-import name="Sippy" state="fresh" size="168" hint-size="168px,168px"></dc-import>
</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="font-size: 40px; line-height: 44px; font-weight: 800; letter-spacing: -0.03em">One More Sip</div>
<div style="width: 28px; height: 4px; border-radius: 999px; background: {{t.accent}}"></div>
</div>
</div>
<div role="progressbar" aria-label="Loading" style="display: flex; gap: 8px">
<span style="width: 8px; height: 8px; border-radius: 999px; background: {{t.accent}}; display: block"></span>
<span style="width: 8px; height: 8px; border-radius: 999px; background: {{t.accent}}; opacity: 0.5; display: block"></span>
<span style="width: 8px; height: 8px; border-radius: 999px; background: {{t.accent}}; opacity: 0.25; display: block"></span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';
    return {
      t: dark
        ? { bg: '#121413', ink: '#ECEEEC', accent: '#4FD1C1', halo: '#1F4A45', ring: '#163330', sun: 'rgba(242,184,92,0.6)', coral: 'rgba(255,143,122,0.6)' }
        : { bg: '#F7F4EE', ink: '#111312', accent: '#0B7F75', halo: '#BFEAE3', ring: '#E3F5F1', sun: '#FFD27A', coral: '#FF9E87' }
    };
  }
}
</script>
</body>
</html>
